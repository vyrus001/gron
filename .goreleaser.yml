version: 2

builds:
  - id: gron
    main: .
    binary: gron
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.gronVersion={{.Version}}
    goos:
      - darwin
      - linux
      - windows
      - freebsd
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - '7'
    ignore:
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm

archives:
  - id: gron
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
          - tar.gz

release:
  replace_existing_artifacts: true
  github:
    owner: vyrus001
    name: gron

source:
  enabled: true
